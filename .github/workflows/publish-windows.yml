name: Publish verified Windows release
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view 38722477395 --json conclusion,headSha --jq 'select(.conclusion == "success" and .headSha == "3c2fb398704ce763f691f5db20da621eeaef9551")' > /tmp/build.json
          test -s /tmp/build.json
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 38722477395
          pattern: Windows-*
          path: artifacts
      - name: Check hashes and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for arch in x64 x86; do
            (cd "artifacts/Windows-$arch"; sed -i 's/\r$//' "SHA256SUMS-Windows-$arch.txt"; sha256sum -c "SHA256SUMS-Windows-$arch.txt")
          done
          gh release upload v1.8.0 artifacts/Windows-x64/* artifacts/Windows-x86/*
